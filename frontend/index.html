<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云栈</title>
    <script>
      // 主题要在第一帧之前定下来，否则启动画面会先闪一下亮色。
      (function () {
        try {
          var m = localStorage.getItem('weft.theme') || 'auto'
          var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <style>
      /* 启动遮罩：直接写在入口 HTML 里，不依赖 JS 与外部样式表。
         窗口一出现就有内容，避免 WebView 加载期间的大面积白屏。 */
      html, body { margin: 0; height: 100%; background: #F4F6F9; }
      html[data-theme="dark"], html[data-theme="dark"] body { background: #080B10; }
      #boot {
        position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #F4F6F9; -webkit-user-select: none; user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity .3s ease, visibility .3s ease;
      }
      html[data-theme="dark"] #boot {
        background:
          radial-gradient(720px 460px at 50% 8%, rgba(74, 118, 216, .16), transparent 68%),
          #080B10;
      }
      #boot.hide { opacity: 0; visibility: hidden; }
      #boot .mark {
        width: 64px; height: 64px; border-radius: 16px;
        object-fit: contain;
        filter: drop-shadow(0 14px 26px rgba(16, 26, 60, .35));
        animation: boot-lift 2s ease-in-out infinite;
      }
      #boot .name { margin-top: 16px; font-size: 15px; font-weight: 600; color: #0F172A; letter-spacing: .02em; }
      html[data-theme="dark"] #boot .name { color: #E8EEF7; }
      #boot .hint { margin-top: 7px; font-size: 11.5px; color: #8A94A3; }
      html[data-theme="dark"] #boot .hint { color: #64748B; }
      #boot .bar { position: relative; margin-top: 20px; width: 148px; height: 3px; border-radius: 3px; background: #E3E8EF; overflow: hidden; }
      html[data-theme="dark"] #boot .bar { background: #1A2432; }
      #boot .bar i {
        position: absolute; top: 0; bottom: 0; left: 0; width: 46%; border-radius: 3px;
        background: linear-gradient(90deg, rgba(58, 95, 208, 0), #3A5FD0 55%, #5A82E8);
        animation: boot-slide 1.25s cubic-bezier(.55, .1, .35, .9) infinite;
      }
      html[data-theme="dark"] #boot .bar i {
        background: linear-gradient(90deg, rgba(107, 144, 240, 0), #6B90F0 55%, #93B0FF);
      }
      @keyframes boot-lift {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-3px) scale(1.035); }
      }
      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(238%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .mark, #boot .bar i { animation: none; }
        #boot .bar i { width: 100%; opacity: .5; }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <img class="mark" src="/appicon.png" alt="" draggable="false" />
      <div class="name">云栈</div>
      <div class="hint">正在启动…</div>
      <div class="bar"><i></i></div>
    </div>
    <script>
      // WebView 加载/解析异常时别把用户永远留在遮罩上，给一句更明确的提示。
      setTimeout(function () {
        var h = document.querySelector('#boot .hint')
        if (h) h.textContent = '正在准备界面，请稍候…'
      }, 6000)
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
