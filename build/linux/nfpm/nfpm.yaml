# nfpm 配置：打 .deb / .rpm / archlinux 包（`wails3 tool package`）
#
# 与 Wails 模板默认值的差异，都是本项目实际情况决定的，不要照抄回模板：
# - 包名用 ASCII 的 weft：deb 包名不允许中文；可执行文件也叫 weft，CLI 调用方便
# - 依赖 GTK3 + WebKit2GTK 4.1：本项目按 `-tags gtk3` 构建（见 scripts/build-linux.sh），
#   模板默认的 gtk4 / webkitgtk-6.0 与二进制实际链接的库不一致，装了也起不来
# - 图标按真实尺寸落到 hicolor/1024x1024，塞进 128 目录会让图标缓存索引错乱
# - arch 写死 amd64：Linux 侧必须原生 CGO 编译，交叉出来的 arm64 包没意义
name: "weft"
arch: "amd64"
platform: "linux"
version: "0.1.0"
section: "net"
priority: "optional"
maintainer: "Boothua <boothua@boothua.cn>"
description: |-
  云栈 —— Tailscale / Headscale 桌面客户端。
  节点跑在应用进程内，接管系统网络后 ssh / mysql / psql 等外部工具可直接访问 tailnet 与内网网段。
vendor: "Boothua"
homepage: "https://git.boothua.cn/boothua/WeftDesk"
release: "1"

contents:
  - src: "./bin/weft"
    dst: "/usr/local/bin/weft"
    file_info:
      mode: 0755
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/1024x1024/apps/weft.png"
    file_info:
      mode: 0644
  - src: "./build/linux/weft.desktop"
    dst: "/usr/share/applications/weft.desktop"
    file_info:
      # 默认会跟着源文件权限走，带执行位不合 Debian 规范（lintian 会报）
      mode: 0644

# 与构建标签一致的运行时依赖
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
