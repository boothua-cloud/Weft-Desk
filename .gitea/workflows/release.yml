name: release

# Gitea Actions：打 tag（v1.0.0）或手动触发时，各平台在原生环境构建，
# 最后统一上传到仓库的「发布」里。
#
# runner 要求（Gitea → 仓库 → 设置 → Actions → Runners，label 要对得上）：
#   ubuntu-latest  —— Linux 版必须在 Linux 上编译（依赖 webkit2gtk 的 C 库）
#   macos-latest   —— 出 dmg
#   windows-latest —— 出 NSIS 安装包
# 只注册了 Linux runner 时，mac/windows 两个 job 会一直排队，可以先注释掉。
#
# 发布用到的令牌：仓库 → 设置 → 密钥，新增 RELEASE_TOKEN（勾 repo 权限）。
# 不配会退回 runner 自带的 gitea.token，权限取决于 runner 的配置。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  macos:
    name: macOS (dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备工具链
        run: |
          go version
          node -v
          command -v wails3 || go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: 构建
        run: wails3 build -tags devtools

      - name: 打包 dmg
        run: ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 NSIS
        run: choco install nsis -y --no-progress

      - name: 准备工具链
        shell: bash
        run: |
          go version
          command -v wails3 || go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: 构建并打包
        shell: bash
        run: |
          wails3 task windows:package ARCH=amd64
          mkdir -p release
          mv bin/weft-amd64-installer.exe "release/云栈-windows-amd64-setup.exe"
          cp bin/云栈.exe "release/云栈-windows-amd64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  linux:
    name: Linux (tar.gz + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: 准备工具链
        run: |
          go version
          command -v wails3 || go install github.com/wailsapp/wails/v3/cmd/wails3@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: 构建
        run: wails3 build -tags devtools

      - name: 打包
        run: |
          mkdir -p release
          tar -C bin -czf "release/云栈-linux-amd64.tar.gz" 云栈
          # deb 用 wails3 自带的打包工具，环境里没有 nfpm 时跳过
          wails3 tool package --format deb --name 云栈 --out release || true

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.tar.gz
            release/*.deb
          if-no-files-found: warn

  publish:
    name: 发布
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 上传到 Release
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || gitea.token }}
        run: |
          if [ "${GITHUB_REF_TYPE:-tag}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="build-$(date -u +%Y%m%d-%H%M)"
          fi
          chmod +x scripts/gitea-release.sh
          ./scripts/gitea-release.sh dist "$TAG"
