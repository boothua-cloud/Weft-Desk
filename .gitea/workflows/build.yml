name: build

# Gitea Actions 主流水线：一次跑出 Windows zip 与 Linux deb。
#
# 设计前提：自建 Gitea 一般只注册了 Linux 的 docker runner。所以
#   - Windows 产物用「Linux 上交叉编译」（Wails 的 Windows 后端是纯 Go，CGO_ENABLED=0 可交叉）
#   - Linux 产物必须原生编译（CGO 要链 gtk/webkit），正好也在同一个 runner 上
#   - macOS 必须 macOS 主机（Cocoa + hdiutil），没有 macos-latest runner，不进流水线；
#     dmg 本地用 scripts/make-dmg.sh 出
#
# 为什么不直接 `wails3 build`：
#   1. Windows 的 Taskfile 里有一句用系统 shell 删 syso 的步骤（platforms: [windows]），
#      交叉编译时会被判成 windows 平台而在 Linux 上执行，必然失败；
#   2. Linux 默认走 GTK4 + WebKitGTK 6.0，Debian 12 没有 webkitgtk-6.0，
#      必须显式带 `gtk3` 标签，否则编译期 pkg-config 就找不到库。
# 下面把步骤拆开手写，产物与本地 `wails3 build` 一致。
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

env:
  # 国内网络直连 proxy.golang.org 常超时
  GOPROXY: https://goproxy.cn,direct
  GOSUMDB: sum.golang.google.cn
  # 与 build/config.yml、build/linux/nfpm/nfpm.yaml 的 version 保持一致
  APP_VERSION: 0.1.0
  # 与 go.mod 保持同步
  GO_VERSION: 1.27.4

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        # 不走 actions/checkout：那个 action 要从 github.com 拉源码，容器出网会超时
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="Authorization: token ${GITHUB_TOKEN}" \
            fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: 安装 Go
        # 不用 actions/setup-go：它要从 github.com 拉源码，容器出网超时。
        # 阿里云镜像有官方 tarball，国内直连。Node 由基础镜像提供，不用另装。
        run: |
          # weft-ci 镜像里已预装，没有才现下（用普通 node 镜像时走这条）
          if command -v go >/dev/null 2>&1; then
            echo "已预装 $(go version)，跳过"
            exit 0
          fi
          curl -fsSL "https://mirrors.aliyun.com/golang/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          /usr/local/go/bin/go version
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: 安装 wails3
        # CGO_ENABLED=0：linux+cgo 的 CLI 会要 pkg-config gtk4 + webkitgtk-6.0，
        # 本项目按 gtk3 构建，不该为装个打包工具去拉 GTK4 头文件
        run: |
          command -v wails3 >/dev/null 2>&1 && { echo "已预装 $(wails3 version)"; exit 0; }
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: 构建前端
        working-directory: frontend
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci --include=dev
          npm run build

      - name: 生成 Windows 资源（图标 + 清单）
        run: |
          WAILS3="$(go env GOPATH)/bin/wails3"
          cd build
          "$WAILS3" generate syso -arch amd64 \
            -icon windows/icon.ico \
            -manifest windows/wails.exe.manifest \
            -info windows/info.json \
            -out ../wails_windows_amd64.syso

      - name: 交叉编译 Windows 可执行文件
        run: |
          go mod download
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -tags production -trimpath -buildvcs=false \
            -ldflags="-w -s -H windowsgui" \
            -o bin/云栈.exe .
          rm -f wails_windows_amd64.syso

      - name: 取 WinTun 运行库
        run: bash scripts/fetch-wintun.sh amd64

      - name: 打包
        run: |
          mkdir -p release
          # wintun.dll 必须和 exe 同目录，只发 exe 是跑不起来的
          cp bin/云栈.exe bin/wintun.dll release/
          cd release
          # -UN=UTF8：解压到中文 Windows 时文件名不乱码
          zip -r -UN=UTF8 -q "云栈-${APP_VERSION}-windows-amd64.zip" 云栈.exe wintun.dll
          ls -la

      - name: 直接发到「发布」
        # 不再往 dist-* 分支塞产物：每个 job 构建完就把自己的文件挂到同一个 Release，
        # 少一次孤儿分支提交，产物也不用再搬一次。
        env:
          TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
            *) TAG="build-${GITHUB_SHA:0:8}" ;;
          esac
          chmod +x scripts/gitea-release.sh
          ./scripts/gitea-release.sh release "$TAG"

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        # 不走 actions/checkout：那个 action 要从 github.com 拉源码，容器出网会超时
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="Authorization: token ${GITHUB_TOKEN}" \
            fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: 安装 Go
        # 不用 actions/setup-go：它要从 github.com 拉源码，容器出网超时。
        # 阿里云镜像有官方 tarball，国内直连。Node 由基础镜像提供，不用另装。
        run: |
          # weft-ci 镜像里已预装，没有才现下（用普通 node 镜像时走这条）
          if command -v go >/dev/null 2>&1; then
            echo "已预装 $(go version)，跳过"
            exit 0
          fi
          curl -fsSL "https://mirrors.aliyun.com/golang/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          /usr/local/go/bin/go version
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: 安装 GTK3 / WebKit2GTK 构建依赖
        run: |
          export DEBIAN_FRONTEND=noninteractive
          APT="-o Acquire::Retries=5 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30"

          # 直接用中科大源。只替换域名，路径保持不变，这样 Debian 的
          # /debian 和 /debian-security、Ubuntu 的 /ubuntu 都能对上。
          # 改之前先备份，万一镜像缺组件还能退回去。
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$f" ] || continue
            sudo cp -f "$f" "$f.orig"
            sudo sed -i \
              -e 's|deb.debian.org|mirrors.ustc.edu.cn|g' \
              -e 's|security.debian.org|mirrors.ustc.edu.cn|g' \
              -e 's|archive.ubuntu.com|mirrors.ustc.edu.cn|g' \
              -e 's|security.ubuntu.com|mirrors.ustc.edu.cn|g' "$f"
          done

          if ! sudo apt-get $APT update -qq; then
            echo "::warning::中科大源不可用，回退发行版默认源"
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
              [ -f "$f.orig" ] && sudo cp -f "$f.orig" "$f"
            done
            sudo apt-get $APT update -qq
          fi

          sudo apt-get $APT install -y -qq \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: 安装 wails3
        # CGO_ENABLED=0：linux+cgo 的 CLI 会要 pkg-config gtk4 + webkitgtk-6.0，
        # 本项目按 gtk3 构建，不该为装个打包工具去拉 GTK4 头文件
        run: |
          command -v wails3 >/dev/null 2>&1 && { echo "已预装 $(wails3 version)"; exit 0; }
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: 构建前端
        working-directory: frontend
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci --include=dev
          npm run build

      - name: 编译（CGO + gtk3）
        run: |
          go mod download
          CGO_ENABLED=1 go build -tags "production gtk3" \
            -trimpath -buildvcs=false -ldflags="-w -s" -o bin/云栈 .

      - name: 生成 .desktop
        run: |
          WAILS3="$(go env GOPATH)/bin/wails3"
          mkdir -p build/linux
          "$WAILS3" generate .desktop -name "云栈" -exec 云栈 -icon weft \
            -outputfile build/linux/weft.desktop -categories "Network;Utility;"

      - name: 打 deb
        run: |
          WAILS3="$(go env GOPATH)/bin/wails3"
          mkdir -p release
          "$WAILS3" tool package -name 云栈 -format deb \
            -config ./build/linux/nfpm/nfpm.yaml -out release
          # wails3 只按 <name>.deb 命名，版本与架构要自己补上，
          # 否则 next release 会和上一个同名覆盖
          mv release/云栈.deb "release/云栈_${APP_VERSION}-1_amd64.deb"
          # deb 之外再给一份裸二进制：装不上时解压即可运行
          tar -C bin -czf "release/云栈-${APP_VERSION}-linux-amd64.tar.gz" 云栈
          ls -la release/

      - name: 直接发到「发布」
        # 不再往 dist-* 分支塞产物：每个 job 构建完就把自己的文件挂到同一个 Release，
        # 少一次孤儿分支提交，产物也不用再搬一次。
        env:
          TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
            *) TAG="build-${GITHUB_SHA:0:8}" ;;
          esac
          chmod +x scripts/gitea-release.sh
          ./scripts/gitea-release.sh release "$TAG"

  installer:
    # 安装包依赖 makensis 和 WebView2 bootstrapper，只在打 tag 时做
    needs: windows
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        # 不走 actions/checkout：那个 action 要从 github.com 拉源码，容器出网会超时
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="Authorization: token ${GITHUB_TOKEN}" \
            fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD

      - name: 安装 Go
        # 不用 actions/setup-go：它要从 github.com 拉源码，容器出网超时。
        # 阿里云镜像有官方 tarball，国内直连。Node 由基础镜像提供，不用另装。
        run: |
          # weft-ci 镜像里已预装，没有才现下（用普通 node 镜像时走这条）
          if command -v go >/dev/null 2>&1; then
            echo "已预装 $(go version)，跳过"
            exit 0
          fi
          curl -fsSL "https://mirrors.aliyun.com/golang/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          /usr/local/go/bin/go version
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: 安装 wails3 与 NSIS
        run: |
          if command -v makensis >/dev/null 2>&1; then
            echo "makensis 已预装，跳过"
          else
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
              [ -f "$f" ] || continue
              sudo sed -i -e 's|deb.debian.org|mirrors.ustc.edu.cn|g' \
                -e 's|security.debian.org|mirrors.ustc.edu.cn|g' \
                -e 's|archive.ubuntu.com|mirrors.ustc.edu.cn|g' \
                -e 's|security.ubuntu.com|mirrors.ustc.edu.cn|g' "$f"
            done
            sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
          fi
          # 必须 CGO_ENABLED=0：wails3 CLI 在 linux+cgo 下会 import
          # internal/operatingsystem/webkit_linux.go，硬要 pkg-config gtk4 +
          # webkitgtk-6.0，而本项目按 gtk3 构建，装了 GTK4 纯属为装个打包工具
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          # 同 linux job：先用自带源，失败再换镜像，不写死 suite
          export DEBIAN_FRONTEND=noninteractive
          APT="-o Acquire::Retries=5 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=30"
          if ! sudo apt-get $APT update -qq; then
            echo "::warning::默认 apt 源不可用，切换清华镜像重试"
            for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
              [ -f "$f" ] && sudo sed -i \
                -e 's|http://archive.ubuntu.com/ubuntu|http://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' \
                -e 's|http://security.ubuntu.com/ubuntu|http://mirrors.tuna.tsinghua.edu.cn/ubuntu|g' "$f"
            done
            sudo apt-get $APT update -qq || true
          fi
          sudo apt-get $APT install -y -qq nsis zip

      - name: 构建 Windows 可执行文件
        run: |
          WAILS3="$(go env GOPATH)/bin/wails3"
          (cd frontend && npm config set registry https://registry.npmmirror.com \
            && npm ci --include=dev && npm run build)
          (cd build && "$WAILS3" generate syso -arch amd64 -icon windows/icon.ico \
             -manifest windows/wails.exe.manifest -info windows/info.json \
             -out ../wails_windows_amd64.syso)
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -tags production -trimpath -buildvcs=false \
            -ldflags="-w -s -H windowsgui" -o bin/云栈.exe .
          rm -f wails_windows_amd64.syso
          bash scripts/fetch-wintun.sh amd64

      - name: 生成 NSIS 安装包
        run: |
          WAILS3="$(go env GOPATH)/bin/wails3"
          cd build/windows/nsis
          # project.nsi 会引用这个 bootstrapper，缺了打不出安装包
          "$WAILS3" generate webview2bootstrapper -dir .
          # WINTUN_DLL 走绝对路径：project.nsi 的默认值是 Windows 反斜杠相对路径，
          # Linux 上 /FileExists 认不出来，会直接 !error 中断
          ROOT="$(cd ../../.. && pwd)"
          makensis -DWAILS_INSTALL_SCOPE=user -DREQUEST_EXECUTION_LEVEL=user \
            -DARG_WAILS_AMD64_BINARY="$ROOT/bin/云栈.exe" \
            -DWINTUN_DLL="$ROOT/bin/wintun.dll" project.nsi
          ls -la ../../../bin/
          # 归到 release/ 供上传步骤，命名和本地打包保持一致
          cd "$ROOT"
          mkdir -p release
          for f in bin/*installer.exe; do
            mv "$f" "release/云栈-${APP_VERSION}-windows-amd64-setup.exe"
          done

      - name: 直接发到「发布」
        # 不再往 dist-* 分支塞产物：每个 job 构建完就把自己的文件挂到同一个 Release，
        # 少一次孤儿分支提交，产物也不用再搬一次。
        env:
          TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
            *) TAG="build-${GITHUB_SHA:0:8}" ;;
          esac
          chmod +x scripts/gitea-release.sh
          ./scripts/gitea-release.sh release "$TAG"

  macos:
    # 跑在 macOS 上的原生 runner（host 模式，不是 Docker 容器）：
    # 只有 Darwin 环境才有 hdiutil / codesign / Cocoa framework。
    #
    # 这一步刻意不用 actions/checkout、setup-go 这些 action —— 它们都要从
    # github.com 拉源码，这台 Mac 直连不通。host 模式下工具链本来就在宿主上，
    # 代码直接从内网的 Gitea 拉，整条链路零外网依赖。
    runs-on: macos-latest
    steps:
      - name: 检出
        run: |
          git init -q .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="Authorization: token ${GITHUB_TOKEN}" \
            fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout -q FETCH_HEAD
          git log --oneline -1

      - name: 构建并打包
        # 宿主已有 go / node / wails3，不用 setup；wails3 build 自己会跑前端构建
        run: |
          wails3 build -tags devtools
          ./scripts/make-dmg.sh

      - name: 直接发到「发布」
        env:
          TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) TAG="${GITHUB_REF#refs/tags/}" ;;
            *) TAG="build-${GITHUB_SHA:0:8}" ;;
          esac
          chmod +x scripts/gitea-release.sh
          ./scripts/gitea-release.sh release "$TAG"
