name: build

# 三个平台分别在自己原生环境里构建：Linux 的 Wails 后端依赖 webkit2gtk，
# 在 macOS 上交叉编译不出来（需要完整的 Linux sysroot），走 Ubuntu runner 最省事。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-amd64
          - os: ubuntu-22.04
            name: linux-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: 安装 wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: 构建
        shell: bash
        run: |
          wails3 build -tags devtools
          if [ "${{ runner.os }}" = "macOS" ]; then
            ./scripts/make-app.sh
          fi

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" = "macOS" ]; then
            hdiutil create -volname "云栈" -srcfolder "bin/云栈.app" -ov -format UDZO "release/云栈-macos-arm64.dmg"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp bin/weft.exe "release/云栈-windows-amd64.exe"
          else
            cp bin/weft "release/云栈-linux-amd64"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*
