name: build

# GitHub Actions：三平台都在原生托管 runner 上构建。
#   linux   → ubuntu-24.04 出 tar.gz
#   windows → windows-latest 出 zip
#   macos   → macos-14 (arm64) 出 dmg
#
# 只在两种情况下跑，日常 push 不触发（省额度也省时间）：
#   1. 打 tag（v1.0.0）→ 构建 + 挂到 Release
#   2. 手动 Run workflow → 只构建，产物在 Actions 页面的 artifact 里

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  APP_VERSION: 0.1.2
  WAILS_VERSION: v3.0.0
  GOTOOLCHAIN: local

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 解析版本号
        # tag 触发取 tag（v0.1.1 → 0.1.1），手动触发用 APP_VERSION
        # 显式指定 bash：Windows runner 默认是 pwsh，跑不了这段 shell 语法
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${APP_VERSION}"; fi
          echo "VER=$V" >> $GITHUB_ENV
          echo "版本号: $V"

      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: 安装 wails3
        # CGO_ENABLED=0：CLI 是纯 Go 工具，开了会去要 gtk4 头文件
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci --include=dev
          npm run build

      - name: 编译
        # 必须带 gtk3 标签：Wails 默认走 GTK4 + WebKitGTK 6.0，Ubuntu 没有这个包
        run: |
          go mod download
          CGO_ENABLED=1 go build -tags "production gtk3" \
            -trimpath -buildvcs=false -ldflags="-w -s" -o bin/weft .

      - name: 生成 .desktop
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails3 generate .desktop -name "云栈" -exec weft -icon weft \
            -outputfile build/linux/weft.desktop -categories "Network;Utility;"

      - name: 打包 tar.gz 与 deb
        run: |
          mkdir -p dist
          tar -C bin -czf "dist/weft-${VER}-linux-amd64.tar.gz" weft

          # deb 用 nfpm 打，配置在 build/linux/nfpm/nfpm.yaml
          export VERSION="$VER"
          echo "deb 版本号: $VERSION"

          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          "$(go env GOPATH)/bin/nfpm" package -f build/linux/nfpm/nfpm.yaml -p deb -t dist/
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 解析版本号
        # tag 触发取 tag（v0.1.1 → 0.1.1），手动触发用 APP_VERSION
        # 显式指定 bash：Windows runner 默认是 pwsh，跑不了这段 shell 语法
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${APP_VERSION}"; fi
          echo "VER=$V" >> $GITHUB_ENV
          echo "版本号: $V"

      - name: 安装 wails3
        shell: bash
        run: |
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: 构建前端
        working-directory: frontend
        run: |
          npm ci --include=dev
          npm run build

      - name: 编译
        shell: bash
        run: |
          go mod download
          go generate ./... 2>/dev/null || true
          CGO_ENABLED=0 go build -tags production \
            -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o bin/weft.exe .

      - name: 取 WinTun 运行库
        # 缺了 wintun.dll 的包点「连接」只会报 Unable to load library，
        # 与其发一个装好也连不上的包，不如这一步直接失败
        shell: bash
        run: bash scripts/fetch-wintun.sh amd64

      - name: 打包 zip（便携版）
        # Windows runner 上没有 zip 命令，用 PowerShell 自带的 Compress-Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item bin\weft.exe out\
          Copy-Item bin\wintun.dll out\
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path out\* -DestinationPath "dist\weft-$env:VER-windows-amd64.zip" -Force

      - name: 安装 NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 取 WebView2 引导程序
        # 安装包要在没装 WebView2 的机器上自己补运行库，必须把这个 exe 嵌进去。
        # 它在 .gitignore 里，CI 上得现生成；wails3 自带一份，不用联网。
        shell: pwsh
        run: wails3 generate webview2bootstrapper -dir build/windows/nsis

      - name: 打 NSIS 安装包
        # 装到 %LOCALAPPDATA%\Programs\Weft，per-user 免 UAC；
        # NSIS 的 VIProductVersion 只认 x.y.z 四段数字，预览版 tag（v0.1.2-rc1）
        # 带连字符就不注入版本，用 project.nsi 里的默认值
        shell: pwsh
        run: |
          $defines = @(
            "/DARG_WAILS_AMD64_BINARY=$PWD\bin\weft.exe",
            "/DWINTUN_DLL=$PWD\bin\wintun.dll",
            "/DWAILS_INSTALL_SCOPE=user",
            "/DREQUEST_EXECUTION_LEVEL=user"
          )
          if ($env:VER -match '^\d+\.\d+\.\d+$') { $defines += "/DINFO_PRODUCTVERSION=$env:VER" }
          Push-Location build\windows\nsis
          & makensis @defines project.nsi
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "makensis 退出码 $code" }
          Copy-Item bin\weft-amd64-installer.exe "dist\weft-$env:VER-windows-amd64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 解析版本号
        # tag 触发取 tag（v0.1.1 → 0.1.1），手动触发用 APP_VERSION
        # 显式指定 bash：Windows runner 默认是 pwsh，跑不了这段 shell 语法
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${APP_VERSION}"; fi
          echo "VER=$V" >> $GITHUB_ENV
          echo "版本号: $V"

      - name: 构建并打包
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails3 build -tags devtools
          VERSION="$VER" ./scripts/make-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/*.dmg
          if-no-files-found: error

  release:
    needs: [linux, windows, macos]
    # 打 v* 的 tag 就发版；tag 里带连字符的当预览版（v0.2.0-beta.1），
    # 不带的是正式版（v0.2.0）—— 跟语义化版本的约定一致
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 这个 job 只拿到 artifact，没有工作区；CHANGELOG.md 要靠 checkout 拿
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 判断是正式还是预览
        id: kind
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "title=${GITHUB_REF_NAME}（预览版）" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "title=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: 组装发布说明
        # 更新记录以 CHANGELOG.md 为唯一来源：截出本版本那一节，
        # 后面接上下载表格。找不到对应小节就退化成一句说明 + 自动提交列表。
        run: |
          VER="${GITHUB_REF_NAME#v}"
          : > release-body.md
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VER" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              on && index($0, "## [") == 1 { exit }
              on { print }
            ' CHANGELOG.md > release-body.md
          fi
          if [ ! -s release-body.md ]; then
            echo "本版本没有手写更新记录，变更列表见下方自动生成的提交记录。" > release-body.md
          fi
          cat >> release-body.md <<'EOF'

          ## 下载

          | 平台 | 文件 |
          |---|---|
          | macOS (Apple Silicon) | `weft-*-macos-arm64.dmg` |
          | Windows x64 | `weft-*-windows-amd64-setup.exe`（安装版，免管理员）<br>`weft-*-windows-amd64.zip`（便携版，解压即用） |
          | Linux x64 | `weft-*-linux-amd64.tar.gz` / `weft_*_amd64.deb` |

          Windows 首次连接会弹一次 UAC（创建虚拟网卡），装好「系统助手」之后不再提示。
          EOF
          echo "--- 发布说明 ---"
          cat release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: ${{ steps.kind.outputs.title }}
          prerelease: ${{ steps.kind.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body_path: release-body.md

      - name: 写入发布说明
        # action-gh-release 在「release 已存在」时会先建一个带 body 的草稿、
        # 再切回已有 release，正文就丢了（日志里是 Using release ... instead of
        # duplicate draft）。这里用 gh 明确写一次，覆盖上面的不确定行为。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --notes-file release-body.md
