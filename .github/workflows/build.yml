name: build

# 三个平台分别在自己原生环境里构建：Linux 的 Wails 后端依赖 webkit2gtk，
# 在 macOS 上交叉编译不出来（需要完整的 Linux sysroot），走 Ubuntu runner 最省事。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # 这个文件是给 GitHub 用的三平台原生构建；Gitea 的点在
    # .gitea/workflows/build.yml（Linux 交叉编译 Windows 产物）。
    # Gitea 也会扫描 .github/workflows，这里加一道判断，避免在自建实例上
    # 把 windows-latest / macos-latest 的任务排进一个永远没人接的队列。
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-amd64
          - os: ubuntu-22.04
            name: linux-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 必须与 go.mod 的 go 指令一致：低于它的工具链会让 go 去下载整包 toolchain
          go-version: "1.27.4"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: 安装 wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: 准备 WinTun 运行库
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/fetch-wintun.sh amd64

      - name: 构建
        shell: bash
        run: |
          wails3 build -tags devtools
          if [ "${{ runner.os }}" = "macOS" ]; then
            ./scripts/make-app.sh
          fi

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ runner.os }}" = "macOS" ]; then
            hdiutil create -volname "云栈" -srcfolder "bin/云栈.app" -ov -format UDZO "release/云栈-macos-arm64.dmg"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            # wintun.dll 必须和 exe 同目录，单独塞进压缩包，别只发一个 exe
            cp bin/云栈.exe release/
            cp bin/wintun.dll release/
            powershell -Command "Compress-Archive -Path release/云栈.exe,release/wintun.dll -DestinationPath release/云栈-windows-amd64.zip -Force"
            rm -f release/云栈.exe release/wintun.dll
          else
            cp bin/云栈 "release/云栈-linux-amd64"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*
