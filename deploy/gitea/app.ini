APP_NAME = Boothua · 茶亭
RUN_USER = git
RUN_MODE = prod
WORK_PATH = /var/lib/gitea

; ─────── 内网访问的关键 ───────
; ROOT_URL 决定登录跳转、静态资源、cookie 域和 clone 地址。
; 原来写的是 https://git.boothua.cn，用 IP 打开后点登录会被 302 到那个域名，
; 内网解析不到就卡住 —— 这就是「登录不上」的直接原因。
; 只想内网访问就把这三行改成内网地址。

[server]
APP_DATA_PATH = /var/lib/gitea
DOMAIN       = 10.0.1.5
ROOT_URL     = http://10.0.1.5:3000
SSH_DOMAIN   = 10.0.1.5
PROTOCOL     = http
HTTP_PORT    = 3000
DISABLE_SSH  = false
; In rootless gitea container only internal ssh server is supported
START_SSH_SERVER = true
SSH_PORT     = 2222
SSH_LISTEN_PORT =
BUILTIN_SSH_SERVER_USER = git
LFS_START_SERVER = true
; 换掉过一次就同步更新这里；改完 LFS 的旧令牌会失效，客户端重新拉一次
LFS_JWT_SECRET = sHiQjU38oR1n_V579sQ5Fke6OLSOyWsopOkA4RQ3gXM

[repository]
ROOT = /var/lib/gitea/git/repositories

[repository.local]
LOCAL_COPY_PATH = /tmp/gitea/local-repo

[repository.upload]
TEMP_PATH = /tmp/gitea/uploads

[database]
; 建议把密码换掉，并同步改这里（原来那份已经贴到对话里了）
PATH     = /var/lib/gitea/data/gitea.db
DB_TYPE  = mysql
HOST     = 10.0.1.5:3306
NAME     = gitea
USER     = root
PASSWD   = Root2026--
SCHEMA   =
SSL_MODE = disable

[session]
PROVIDER_CONFIG = /var/lib/gitea/data/sessions

[picture]
AVATAR_UPLOAD_PATH = /var/lib/gitea/data/avatars
REPOSITORY_AVATAR_UPLOAD_PATH = /var/lib/gitea/data/repo-avatars

[attachment]
PATH = /var/lib/gitea/data/attachments

[log]
ROOT_PATH = /var/lib/gitea/data/log

[security]
INSTALL_LOCK = true
; 原来是空的！这个用来加密 session cookie，空着登录态会不稳定，
; 也可能就是「登录不上」的另一半原因。填一个固定值后所有人要重新登录一次。
SECRET_KEY = wSf7vh7zoSoD7JXM/PUVT7nLBew29AufUJxx29rav5Q=
; 这个值发给 runner / webhook 做内部认证用，换掉需要重新注册 runner
INTERNAL_TOKEN = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYmYiOjE3OTUxODQzODh9.aGc7hHcVaTRMy5Eqw_8nQW0KAhhis7o9KDEbszXPjQU

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true
REGISTER_EMAIL_CONFIRM = false
ENABLE_NOTIFY_MAIL = false
ENABLE_CAPTCHA = false
DEFAULT_KEEP_EMAIL_PRIVATE = false
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
NO_REPLY_ADDRESS = noreply.localhost

[lfs]
PATH = /var/lib/gitea/git/lfs

[mailer]
ENABLED = false

[cron.update_checker]
; 内网环境没必要往外查更新
ENABLED = false

[repository.signing]
DEFAULT_TRUST_MODEL = committer

[oauth2]
JWT_SECRET = SeKk2PqF3QETgR6mlXTcljVbCFCtv56uX_25kJPqZf0

[audit]
RECORD_OUTPUT = database
